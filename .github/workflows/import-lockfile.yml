name: Import package-lock.json

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact package-lock.json and commit
        run: |
          set -euo pipefail
          curl -fsSL -o package-lock.json.gz https://litter.catbox.moe/bw1pbx.gz
          gzip -dc package-lock.json.gz > package-lock.json
          rm -f package-lock.json.gz
          python3 - <<'PY'
          import hashlib
          data = open("package-lock.json", "rb").read()
          sha = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          print(f"size={len(data)} sha={sha}")
          if sha != "6e313c9e08ea4777eb754eeaa9958f718069fb12":
              raise SystemExit(f"SHA mismatch: {sha}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -f .github/lock-parts/NOTE.txt .github/lock-parts/part-00.b64 || true
          git rm -f .github/workflows/import-lockfile.yml
          git commit -m "Add package-lock.json for reproducible installs"
          git push
